name: ADV Rewards checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  solidity-tests:
    name: Solidity tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Run Foundry tests
        run: forge test -vvv

  frontend-build:
    name: Mini App build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
